name: Add an opportunity
description: Suggest a competition, program, scholarship, or place that's missing.
title: "Add: "
labels: ["new record"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Delaware Tech New Castle County Science Fair 2027
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official page
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Competition
        - Hackathon
        - Research
        - Internship
        - Scholarship
        - Program
        - Camp
        - Workshop
        - Event
        - Volunteering
        - Leadership
        - Club
        - Fellowship
        - Grant
        - Place (library, makerspace, lab, museum…)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What students should know
      description: Who can join, dates, cost, and where it happens. Only include what the official page says.
